  <text x="200" y="812" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">price, demand, cost, inventory history</text>
  <text x="1204" y="770" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">01</text>
