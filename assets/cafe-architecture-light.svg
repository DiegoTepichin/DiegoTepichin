<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 876" width="1280" height="876" role="img" aria-labelledby="t d">
  <title id="t">CAFE architecture</title>
  <desc id="d">Six layers stacked from market data at the bottom to the price decision at the top: market data, causal elasticity, demand forecast, constrained optimizer, calibrated uncertainty, price decision.</desc>
  <rect width="1280" height="876" fill="#ffffff"/>
  <path d="M90 778 V98" fill="none" stroke="#c8893b" stroke-width="2"/>
  <g fill="none" stroke="#c8893b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 171 L90 161 L98 171"/>
    <path d="M82 307 L90 297 L98 307"/>
    <path d="M82 443 L90 433 L98 443"/>
    <path d="M82 579 L90 569 L98 579"/>
    <path d="M82 715 L90 705 L98 715"/>
  </g>
  <g fill="none" stroke="#c8893b" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="3 5">
    <path d="M102 98 H160"/>
    <path d="M102 234 H160"/>
    <path d="M102 370 H160"/>
    <path d="M102 506 H160"/>
    <path d="M102 642 H160"/>
    <path d="M102 778 H160"/>
  </g>
  <rect x="160" y="40" width="1080" height="116" rx="8" fill="none" stroke="#c8893b" stroke-width="2"/>
  <circle cx="90" cy="98" r="9" fill="#c8893b"/>
  <text x="200" y="92" fill="#1f2328" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-0.5">Price decision</text>
  <text x="200" y="132" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">recommended price, explained in plain language</text>
  <text x="1204" y="90" text-anchor="end" fill="#c8893b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">06</text>
  <rect x="160" y="176" width="1080" height="116" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="234" r="7" fill="#ffffff" stroke="#c8893b" stroke-width="2"/>
  <text x="200" y="228" fill="#1f2328" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-0.5">Calibrated uncertainty</text>
  <text x="200" y="268" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">price band, demand range, confidence</text>
  <text x="1204" y="226" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">05</text>
  <rect x="160" y="312" width="1080" height="116" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="370" r="7" fill="#ffffff" stroke="#c8893b" stroke-width="2"/>
  <text x="200" y="364" fill="#1f2328" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-0.5">Constrained optimizer</text>
  <text x="200" y="404" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">risk-adjusted profit under business rules</text>
  <text x="1204" y="362" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">04</text>
  <rect x="160" y="448" width="1080" height="116" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="506" r="7" fill="#ffffff" stroke="#c8893b" stroke-width="2"/>
  <text x="200" y="500" fill="#1f2328" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-0.5">Demand forecast</text>
  <text x="200" y="540" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">ensemble validated forward in time</text>
  <text x="1204" y="498" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">03</text>
  <rect x="160" y="584" width="1080" height="116" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="642" r="7" fill="#ffffff" stroke="#c8893b" stroke-width="2"/>
  <text x="200" y="636" fill="#1f2328" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-0.5">Causal elasticity</text>
  <text x="200" y="676" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">how demand truly responds to price</text>
  <text x="1204" y="634" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">02</text>
